[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
; the game grabs the mouse itself, only while playing without the N64 pad (SparkyCharacter::UpdateMouse)
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=CaptureDuringMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; The N64 controller is read straight from /dev/input/js* (see N64Pad.h). Keyboard, mouse and
; ordinary gamepads go through these axes; buttons (and the arrow keys, which move or turn the
; camera depending on the CONTROLS setting) are polled in SparkyCharacter.cpp.
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=1.000000,Key=MouseY)
+AxisMappings=(AxisName="PadForward",Scale=1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="PadRight",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="PadTurn",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="PadLook",Scale=1.000000,Key=Gamepad_RightY)
